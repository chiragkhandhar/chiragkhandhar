name: Render README

on:
  push:
    branches: [main]
    paths: [profile.yml, 'scripts/**', package.json]
  schedule:
    - cron: '0 6 1 * *' # monthly: keeps computed years of experience fresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run render
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: render README from profile.yml"
          git push
